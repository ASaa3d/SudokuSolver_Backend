server:
  port: ${PORT:8080}

app:
  jwt:
    issuer: https://sudokusolver.com
    access-ttl: ${ACCESS_TTL:30m}
    private-key: ${PRIVATE_KEY_PATH:classpath:keys/private.pem}
    public-key: classpath:keys/public.pem
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
    reset-password-path: /reset
    verify-password-path: /verify-password

spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000